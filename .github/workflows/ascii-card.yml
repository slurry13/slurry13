name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  card:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: hu553in/ascii-profile-card@v1
        with:
          config: |
            login: slurry13
            uptimeStart: 2021-11-05
            card:
              lowercase: true
              lines:
                - { type: header, text: "slurry13" }
                - { type: kv, key: role, value: "senior software engineer · backend & full-stack" }
                - { type: kv, key: work, value: "senior backend engineer @ qic digital hub" }
                - { type: kv, key: product, value: "building voomy" }
                - { type: kv, key: uptime, value: "{uptime} in the industry" }
                - { type: blank }
                - { type: kv, key: interests, value: "ai, vibe coding, oss, self-hosting, product design" }
                - { type: kv, key: languages, value: "ru, en" }
                - { type: blank }
                - { type: section, title: "skills" }
                - type: kv
                  key: backend
                  value: |-
                    go, java/kotlin, spring, node/bun, python/django,
                    grpc/protobuf
                - { type: kv, key: frontend, value: "typescript, react, next.js" }
                - { type: kv, key: data & messaging, value: "postgres/postgis, redis, clickhouse, kafka, rabbitmq" }
                - type: kv
                  key: platform
                  value: |-
                    aws, gcp, azure, docker, k8s,
                    opentelemetry, prometheus, grafana
                - { type: kv, key: delivery, value: "gitlab ci, github actions, ansible" }
                - { type: blank }
                - { type: section, title: "contact" }
                - { type: kv, key: site, value: "hu553in.dev" }
                - { type: kv, key: email, value: "r.m.khasanshin@gmail.com" }
                - { type: kv, key: linkedin, value: "linkedin.com/in/ruslan-khasanshin" }
                - { type: kv, key: telegram, value: "t.me/rkhasanshin" }
                - { type: blank }
                - { type: section, title: "github stats" }
                - { type: kv, key: repos, value: "{repos} (contributed to {contributedRepos})" }
                - { type: kv, key: stars, value: "{stars}" }
                - { type: kv, key: followers, value: "{followers}" }
                - { type: kv, key: contributions, value: "{contributions} (all time)" }
                - { type: kv, key: lines of code, value: "{loc} ({locAdded}, {locDeleted})" }
                - { type: kv, key: top languages, value: "{topLanguages}" }
