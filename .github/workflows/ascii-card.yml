name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  card:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: hu553in/ascii-profile-card@v1
        with:
          config: |
            login: slurry13
            uptimeStart: 2021-11-05
            card:
              lowercase: true
              lines:
                - { type: header, text: "slurry13" }
                - { type: kv, key: role, value: "-" }
                - { type: kv, key: work, value: "-" }
                - { type: kv, key: product, value: "-" }
                - { type: kv, key: uptime, value: "{uptime} in the industry" }
                - { type: blank }
                - { type: kv, key: interests, value: "hardware, software, reverse" }
                - { type: kv, key: languages, value: "ru, en" }
                - { type: blank }
                - { type: section, title: "skills" }
                - type: kv
                  key: languages
                  value: |-
                    c++, c, nasm, python, js
                - { type: kv, key: backend, value: "fastapi/python" }
                - { type: kv, key: frontend, value: "html, css, js" }
                - { type: kv, key: data, value: "sqlite, postgresql" }
                - { type: kv, key: addition, value: "linux, git, bash" }
                - { type: blank }
                - { type: section, title: "contact" }
                - { type: kv, key: email, value: "matvei@gmail.com" }
                - { type: kv, key: telegram, value: "t.me/holygear" }
                - { type: blank }
                - { type: section, title: "github stats" }
                - { type: kv, key: repos, value: "{repos} (contributed to {contributedRepos})" }
                - { type: kv, key: stars, value: "{stars}" }
                - { type: kv, key: followers, value: "{followers}" }
                - { type: kv, key: contributions, value: "{contributions} (all time)" }
                - { type: kv, key: lines of code, value: "{loc} ({locAdded}, {locDeleted})" }
                - { type: kv, key: top languages, value: "{topLanguages}" }

  snake:
      runs-on: ubuntu-latest
      permissions:
          contents: write
      steps:
        - uses: actions/checkout@v4
        - uses: Platane/snk/svg-only@v3
          with:
            github_user_name: ${{ github.repository_owner }}
            outputs: |
              dist/github-contribution-grid-snake.svg
              dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        - uses: peaceiris/actions-gh-pages@v4
          with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_branch: snake-output
            publish_dir: dist